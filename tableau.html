<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon tableau de bord - Ma voiture et moi</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1b2a3a; }
  .page { padding: 20px; max-width: 480px; margin: 0 auto; }
  h1 { text-align: center; }
  a.lien { display: block; text-align: center; padding: 14px; color: #1565c0; font-size: 16px; }
  .carte { background: #fff; border-radius: 12px; padding: 16px; margin: 14px 0; border-left: 10px solid #999; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .carte.vert { border-left-color: #2e7d32; }
  .carte.orange { border-left-color: #ef6c00; }
  .carte.rouge { border-left-color: #c62828; }
  .titre { font-size: 20px; font-weight: bold; margin-bottom: 6px; }
  .etat { font-size: 17px; font-weight: bold; margin: 8px 0; }
  .e-vert { color: #2e7d32; }
  .e-orange { color: #ef6c00; }
  .e-rouge { color: #c62828; }
  .e-gris { color: #546e7a; }
  .info { font-size: 15px; margin: 4px 0; line-height: 1.4; }
  .d-vert { color: #2e7d32; font-weight: bold; }
  .d-orange { color: #ef6c00; font-weight: bold; }
  .d-rouge { color: #c62828; font-weight: bold; }
  .maj { margin-top: 14px; }
  .maj input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #b0bec5; border-radius: 10px; background: #fff; }
  .maj button { display: block; width: 100%; margin-top: 8px; padding: 12px; font-size: 16px; border: none; border-radius: 10px; background: #1565c0; color: #fff; }
  .maj button:disabled { background: #90a4ae; }
  .retour-ok { margin-top: 8px; color: #2e7d32; font-weight: bold; font-size: 15px; }
  .retour-err { margin-top: 8px; color: #c62828; font-weight: bold; font-size: 15px; }
  .vid { margin-top: 14px; }
  .vid button.ouvrir { display: block; width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 10px; background: #2e7d32; color: #fff; }
  .vid .panneau { margin-top: 10px; padding: 12px; background: #f4f6f8; border-radius: 10px; }
  .vid label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
  .vid input, .vid select { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 1px solid #b0bec5; border-radius: 10px; margin-top: 4px; background: #fff; }
  .vid .note { font-size: 13px; color: #546e7a; margin-top: 4px; }
  .vid button.valider { display: block; width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; border: none; border-radius: 10px; background: #1565c0; color: #fff; }
  .vid button.valider:disabled { background: #90a4ae; }
  .vid button.annuler { display: block; width: 100%; margin-top: 8px; padding: 10px; font-size: 15px; border: none; border-radius: 10px; background: #cfd8dc; color: #1b2a3a; }
</style>
</head>
<body>
<div class="page">
  <h1>🚗 Mon tableau de bord</h1>

  <div id="non-connecte" style="display:none">
    <p style="text-align:center">Tu dois d'abord te connecter.</p>
    <a class="lien" href="connexion.html">Aller à la page de connexion</a>
  </div>

  <div id="contenu" style="display:none">
    <div id="cartes"></div>
    <a class="lien" href="voiture.html">+ Ajouter ou voir mes voitures</a>
    <a class="lien" href="connexion.html">Mon compte</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
  // Si la personne n'a pas choisi son intervalle, on prend ces valeurs
  var INTERVALLE_KM_PAR_DEFAUT = 5000;
  var INTERVALLE_MILES_PAR_DEFAUT = 3100;
  // Distance restante à partir de laquelle on prévient (orange)
  var SEUIL_KM = 500;
  var SEUIL_MILES = 300;
  var INTERVALLE_MOIS = 6;
  var KM_PAR_MILE = 1.609344;

  // Estimations générales en km (pas des données du constructeur)
  var INTERVALLES = {
    minerale:    { essence: 5000,  diesel: 4000 },
    semi:        { essence: 7500,  diesel: 6000 },
    synthetique: { essence: 10000, diesel: 8000 },
    inconnue:    { essence: 5000,  diesel: 5000 }
  };

  var client = supabase.createClient(
    "https://duwvhjhajgzkizfsrscx.supabase.co",
    "sb_publishable_u3Rc1lmK6RhhpTsvns5LDw_9Y7tvkba"
  );

  // Messages à afficher une fois sous une voiture après une action
  var retour = null;
  var retourV = null;

  function ajouter(parent, classe, texte) {
    var d = document.createElement("div");
    d.className = classe;
    d.textContent = texte;
    parent.appendChild(d);
    return d;
  }

  // Date d'aujourd'hui au format AAAA-MM-JJ (heure locale)
  function aujourdhuiTexte() {
    var d = new Date();
    var m = String(d.getMonth() + 1);
    if (m.length < 2) m = "0" + m;
    var j = String(d.getDate());
    if (j.length < 2) j = "0" + j;
    return d.getFullYear() + "-" + m + "-" + j;
  }

  // Intervalle proposé selon l'huile et le carburant (dans l'unité du compteur)
  function proposition(huile, carburant, unite) {
    var t = INTERVALLES[huile];
    if (!t) return null;
    var km = t[carburant === "diesel" ? "diesel" : "essence"];
    if (unite === "miles") return Math.round(km / KM_PAR_MILE / 100) * 100;
    return km;
  }

  function analyser(v) {
    var miles = (v.unite_compteur === "miles");
    var unite = miles ? "miles" : "km";
    var defaut = miles ? INTERVALLE_MILES_PAR_DEFAUT : INTERVALLE_KM_PAR_DEFAUT;
    var seuil = miles ? SEUIL_MILES : SEUIL_KM;
    var inter = (v.intervalle_km && v.intervalle_km > 0) ? v.intervalle_km : defaut;
    var km = v.kilometrage;
    var vkm = v.derniere_vidange_km;
    var erreur = (km != null && vkm != null && vkm > km);
    var kmRestants = (km != null && vkm != null && !erreur) ? (vkm + inter - km) : null;
    var echeance = null;
    var jours = null;
    if (v.derniere_vidange_date) {
      echeance = new Date(v.derniere_vidange_date + "T00:00:00");
      echeance.setMonth(echeance.getMonth() + INTERVALLE_MOIS);
      jours = Math.ceil((echeance - new Date()) / 86400000);
    }
    var etat = "gris";
    var message = "Ajoute la date et le kilométrage de ta dernière vidange.";
    if (erreur) {
      message = "Vérifie tes kilométrages : celui de la vidange est plus grand que le kilométrage actuel.";
    } else if (kmRestants !== null || jours !== null) {
      var retard = (kmRestants !== null && kmRestants <= 0) || (jours !== null && jours <= 0);
      var bientot = (kmRestants !== null && kmRestants <= seuil) || (jours !== null && jours <= 30);
      if (retard) { etat = "rouge"; message = "🔴 Vidange en retard"; }
      else if (bientot) { etat = "orange"; message = "🟠 Vidange bientôt"; }
      else { etat = "vert"; message = "🟢 Vidange à jour"; }
    }
    return { etat: etat, message: message, kmRestants: kmRestants, echeance: echeance, inter: inter, unite: unite };
  }

  // Analyse d'une date de fin (assurance ou visite technique)
  function analyserDate(dateTexte, nom) {
    if (!dateTexte) return null;
    var fin = new Date(dateTexte + "T00:00:00");
    var aujourdhui = new Date();
    aujourdhui.setHours(0, 0, 0, 0);
    var jours = Math.round((fin - aujourdhui) / 86400000);
    var dateAffichee = fin.toLocaleDateString("fr-FR");
    if (jours < 0) {
      var n = Math.abs(jours);
      return { etat: "rouge", texte: "🔴 " + nom + " : dépassée depuis " + n + (n > 1 ? " jours" : " jour") + " (" + dateAffichee + ")" };
    }
    if (jours === 0) {
      return { etat: "orange", texte: "🟠 " + nom + " : se termine aujourd'hui (" + dateAffichee + ")" };
    }
    if (jours <= 30) {
      return { etat: "orange", texte: "🟠 " + nom + " : il reste " + jours + (jours > 1 ? " jours" : " jour") + " (" + dateAffichee + ")" };
    }
    return { etat: "vert", texte: "🟢 " + nom + " : valable jusqu'au " + dateAffichee };
  }

  // Choisit la pire couleur parmi plusieurs états
  function pireEtat(liste) {
    var ordre = { gris: 0, vert: 1, orange: 2, rouge: 3 };
    var pire = "gris";
    liste.forEach(function (e) {
      if (e && ordre[e] > ordre[pire]) pire = e;
    });
    return pire;
  }

  // Enregistre le nouveau kilométrage et la date du jour
  async function mettreAJour(v, champ, bouton) {
    var saisi = champ.value.trim();
    var n = parseInt(saisi, 10);
    if (saisi === "" || isNaN(n) || n < 0) {
      alert("Écris le chiffre que ton compteur affiche.");
      return;
    }
    if (v.kilometrage != null && n < v.kilometrage) {
      if (!confirm("Ce chiffre est plus petit que l'ancien (" + v.kilometrage + "). C'est bien le chiffre de ton compteur ?")) return;
    }
    bouton.disabled = true;
    bouton.textContent = "Mise à jour...";
    try {
      var r = await client.from("voitures").update({ kilometrage: n, kilometrage_maj: aujourdhuiTexte() }).eq("id", v.id).select();
      if (r.error) {
        retour = { id: v.id, ok: false, texte: "Erreur : " + r.error.message };
      } else if (!r.data || r.data.length === 0) {
        retour = { id: v.id, ok: false, texte: "Le kilométrage n'a pas été mis à jour (droit manquant dans Supabase)." };
      } else {
        retour = { id: v.id, ok: true, texte: "Kilométrage mis à jour." };
      }
    } catch (e) {
      retour = { id: v.id, ok: false, texte: "Erreur : impossible de mettre à jour. Vérifie ta connexion." };
    }
    charger();
  }

  // Enregistre une nouvelle vidange (comme le papillon de vidange)
  async function enregistrerVidange(v, dateChamp, kmChamp, huileChamp, interChamp, bouton) {
    var dateSaisie = dateChamp.value;
    var kmTexte = kmChamp.value.trim();
    var n = parseInt(kmTexte, 10);
    if (!dateSaisie) {
      alert("Choisis la date de la vidange.");
      return;
    }
    if (dateSaisie > aujourdhuiTexte()) {
      alert("La date de la vidange ne peut pas être dans le futur.");
      return;
    }
    if (kmTexte === "" || isNaN(n) || n < 0) {
      alert("Écris le chiffre que ton compteur affichait à la vidange.");
      return;
    }
    var interTexte = interChamp.value.trim();
    var inter = (interTexte === "") ? null : parseInt(interTexte, 10);
    if (inter !== null && (isNaN(inter) || inter <= 0)) {
      alert("L'intervalle de vidange doit être plus grand que 0.");
      return;
    }
    if (v.derniere_vidange_km != null && n < v.derniere_vidange_km) {
      if (!confirm("Ce chiffre est plus petit que celui de la vidange d'avant (" + v.derniere_vidange_km + "). C'est bien le chiffre de ton compteur ?")) return;
    }
    if (v.derniere_vidange_date && dateSaisie < v.derniere_vidange_date) {
      if (!confirm("Cette date est plus ancienne que celle de la vidange d'avant. C'est bien la bonne date ?")) return;
    }
    var champs = {
      derniere_vidange_date: dateSaisie,
      derniere_vidange_km: n,
      intervalle_km: inter,
      type_huile: (huileChamp.value !== "") ? huileChamp.value : (v.type_huile || null)
    };
    if (v.kilometrage == null || n > v.kilometrage) {
      champs.kilometrage = n;
      champs.kilometrage_maj = dateSaisie;
    }
    bouton.disabled = true;
    bouton.textContent = "Enregistrement...";
    try {
      var r = await client.from("voitures").update(champs).eq("id", v.id).select();
      if (r.error) {
        retourV = { id: v.id, ok: false, texte: "Erreur : " + r.error.message };
      } else if (!r.data || r.data.length === 0) {
        retourV = { id: v.id, ok: false, texte: "La vidange n'a pas été enregistrée (droit manquant dans Supabase)." };
      } else {
        retourV = { id: v.id, ok: true, texte: "Vidange enregistrée. La prochaine vidange est recalculée." };
      }
    } catch (e) {
      retourV = { id: v.id, ok: false, texte: "Erreur : impossible d'enregistrer. Vérifie ta connexion." };
    }
    charger();
  }

  // Construit le bouton « J'ai fait ma vidange » et sa petite fiche
  function construireVidange(v, a, parent) {
    var zone = document.createElement("div");
    zone.className = "vid";

    var ouvrir = document.createElement("button");
    ouvrir.className = "ouvrir";
    ouvrir.textContent = "J'ai fait ma vidange";
    zone.appendChild(ouvrir);

    if (retourV && retourV.id === v.id) {
      ajouter(zone, retourV.ok ? "retour-ok" : "retour-err", retourV.texte);
    }

    var panneau = document.createElement("div");
    panneau.className = "panneau";
    panneau.style.display = "none";

    function etiquette(texte) {
      var l = document.createElement("label");
      l.textContent = texte;
      panneau.appendChild(l);
    }

    etiquette("Date de la vidange");
    var dateChamp = document.createElement("input");
    dateChamp.type = "date";
    dateChamp.value = aujourdhuiTexte();
    dateChamp.max = aujourdhuiTexte();
    panneau.appendChild(dateChamp);

    etiquette("Kilométrage à la vidange (" + a.unite + ")");
    var kmChamp = document.createElement("input");
    kmChamp.type = "number";
    kmChamp.placeholder = "Ton compteur affichait (" + a.unite + ")";
    panneau.appendChild(kmChamp);

    etiquette("Quelle huile as-tu mise ?");
    var huileChamp = document.createElement("select");
    var choix = [
      ["", "Choisis ton huile"],
      ["minerale", "Minérale"],
      ["semi", "Semi-synthétique"],
      ["synthetique", "Synthétique"],
      ["inconnue", "Je ne sais pas"]
    ];
    choix.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c[0];
      o.textContent = c[1];
      huileChamp.appendChild(o);
    });
    if (v.type_huile && INTERVALLES[v.type_huile]) huileChamp.value = v.type_huile;
    panneau.appendChild(huileChamp);

    etiquette("Prochaine vidange dans (" + a.unite + ")");
    var interChamp = document.createElement("input");
    interChamp.type = "number";
    interChamp.value = a.inter;
    panneau.appendChild(interChamp);

    var note = document.createElement("div");
    note.className = "note";
    panneau.appendChild(note);

    var modifie = false;
    interChamp.oninput = function () { modifie = true; };
    huileChamp.onchange = function () {
      var p = proposition(huileChamp.value, v.carburant, a.unite);
      if (p === null) { note.textContent = ""; return; }
      if (!modifie) interChamp.value = p;
      note.textContent = "Proposition : " + p + " " + a.unite + ". Estimation générale, pas une donnée du constructeur. Tu peux changer le chiffre.";
    };

    var valider = document.createElement("button");
    valider.className = "valider";
    valider.textContent = "Enregistrer la vidange";
    valider.onclick = function () { enregistrerVidange(v, dateChamp, kmChamp, huileChamp, interChamp, valider); };
    panneau.appendChild(valider);

    var annuler = document.createElement("button");
    annuler.className = "annuler";
    annuler.textContent = "Annuler";
    annuler.onclick = function () { panneau.style.display = "none"; };
    panneau.appendChild(annuler);

    ouvrir.onclick = function () {
      panneau.style.display = (panneau.style.display === "none") ? "block" : "none";
    };

    zone.appendChild(panneau);
    parent.appendChild(zone);
  }

  async function charger() {
    var r = await client.from("voitures").select("*").order("created_at", { ascending: false });
    var cartes = document.getElementById("cartes");
    cartes.innerHTML = "";
    if (r.error || !r.data || r.data.length === 0) {
      var vide = document.createElement("p");
      vide.style.textAlign = "center";
      vide.textContent = "Aucune voiture enregistrée pour l'instant.";
      cartes.appendChild(vide);
      return;
    }
    r.data.forEach(function (v) {
      var a = analyser(v);
      var ass = analyserDate(v.assurance_fin, "Assurance");
      var vis = analyserDate(v.visite_technique_fin, "Visite technique");
      var couleur = pireEtat([a.etat, ass ? ass.etat : null, vis ? vis.etat : null]);
      var c = document.createElement("div");
      c.className = "carte " + couleur;
      ajouter(c, "titre", v.marque + " " + v.modele + (v.annee ? " (" + v.annee + ")" : ""));
      if (v.kilometrage != null) {
        var ligne = "Kilométrage actuel : " + v.kilometrage + " " + a.unite;
        if (v.kilometrage_maj) {
          ligne += " (mis à jour le " + new Date(v.kilometrage_maj + "T00:00:00").toLocaleDateString("fr-FR") + ")";
        }
        ajouter(c, "info", ligne);
      }
      ajouter(c, "etat e-" + a.etat, a.message);
      if (a.kmRestants !== null) {
        var km = a.kmRestants > 0 ? ("Il reste " + a.kmRestants + " " + a.unite) : ("Dépassé de " + Math.abs(a.kmRestants) + " " + a.unite);
        ajouter(c, "info", km + " avant la prochaine vidange.");
      }
      ajouter(c, "info", "Vidange tous les " + a.inter + " " + a.unite + " ou " + INTERVALLE_MOIS + " mois.");
      if (a.echeance) {
        ajouter(c, "info", "Date limite : " + a.echeance.toLocaleDateString("fr-FR"));
      }
      if (ass) ajouter(c, "info d-" + ass.etat, ass.texte);
      if (vis) ajouter(c, "info d-" + vis.etat, vis.texte);
      if (v.canal_rappel) {
        ajouter(c, "info", "Rappels par : " + v.canal_rappel + (v.contact_rappel ? " (" + v.contact_rappel + ")" : ""));
      }
      var zone = document.createElement("div");
      zone.className = "maj";
      var champ = document.createElement("input");
      champ.type = "number";
      champ.placeholder = "Ton compteur affiche (" + a.unite + ")";
      zone.appendChild(champ);
      var bouton = document.createElement("button");
      bouton.textContent = "Mettre à jour mon kilométrage";
      bouton.onclick = function () { mettreAJour(v, champ, bouton); };
      zone.appendChild(bouton);
      if (retour && retour.id === v.id) {
        ajouter(zone, retour.ok ? "retour-ok" : "retour-err", retour.texte);
      }
      c.appendChild(zone);
      construireVidange(v, a, c);
      cartes.appendChild(c);
    });
    retour = null;
    retourV = null;
  }

  client.auth.getSession().then(function (r) {
    if (r.data.session) {
      document.getElementById("contenu").style.display = "block";
      charger();
    } else {
      document.getElementById("non-connecte").style.display = "block";
    }
  });
</script>
</body>
</html>
