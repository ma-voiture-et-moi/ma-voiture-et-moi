<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4527A0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234527A0'/%3E%3Ctext x='32' y='40' font-size='22' font-family='Arial' font-weight='bold' text-anchor='middle' fill='white'%3EMVM%3C/text%3E%3C/svg%3E">
<title>Ajouter une voiture - Ma voiture et moi</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1b2a3a; }
  .page { padding: 20px; max-width: 480px; margin: 0 auto; }
  .logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 4px; }
  .badge { width: 48px; height: 48px; border-radius: 12px; background: #4527A0; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; border-bottom: 4px solid #26C6DA; box-sizing: border-box; }
  .marque { color: #4527A0; font-weight: bold; font-size: 20px; }
  h1, h2 { text-align: center; }
  h1 { font-size: 22px; margin: 14px 0 6px 0; }
  label { display: block; margin-top: 14px; font-weight: bold; }
  input[type=text], input[type=date], select { width: 100%; box-sizing: border-box; padding: 14px; font-size: 18px; border: 1px solid #b0bec5; border-radius: 10px; margin-top: 6px; background: #fff; }
  .choix { display: block; margin-top: 10px; padding: 14px; background: #fff; border: 2px solid #b0bec5; border-radius: 10px; font-weight: normal; cursor: pointer; }
  .choix.on { border-color: #4527A0; background: #ede7f6; }
  .choix input { margin-right: 8px; }
  button { display: block; width: 100%; margin-top: 14px; padding: 14px; font-size: 18px; border: none; border-radius: 10px; background: #4527A0; color: #fff; }
  button.gris { background: #607d8b; }
  button:disabled { background: #90a4ae; }
  .note { font-size: 14px; color: #546e7a; margin-top: 4px; }
  #message { margin-top: 14px; font-size: 16px; min-height: 24px; text-align: center; color: #c62828; }
</style>
</head>
<body>
<div class="page">
  <div class="logo"><div class="badge">MVM</div><div class="marque">Ma voiture et moi</div></div>
  <h1>Ajouter ma voiture</h1>
  <div id="ecran-a">
    <h2>Étape 1 sur 2</h2>
    <label for="marque">Marque</label>
    <input id="marque" type="text" placeholder="Toyota">
    <label for="modele">Modèle</label>
    <input id="modele" type="text" placeholder="Hilux">
    <label for="km">Kilométrage actuel (km)</label>
    <input id="km" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Ex : 50000">
    <label>Tu roules comment ?</label>
    <label class="choix"><input type="radio" name="usage" value="peu">Peu (perso, 30 km par jour)</label>
    <label class="choix"><input type="radio" name="usage" value="beaucoup">Beaucoup (travail taxi ou livraison, 120 km par jour)</label>
    <button id="suivant">Suivant</button>
  </div>
  <div id="ecran-b" style="display:none">
    <h2>Étape 2 sur 2</h2>
    <label for="vk">Km de ta dernière vidange</label>
    <input id="vk" type="text" inputmode="numeric" pattern="[0-9]*">
    <p class="note">Si tu ne sais pas, laisse vide.</p>
    <label for="assurance">Date de fin de l'assurance</label>
    <input id="assurance" type="date">
    <label for="visite">Date de fin de la visite technique</label>
    <input id="visite" type="date">
    <label for="huile">Type d'huile</label>
    <select id="huile">
      <option value="Inconnue">Je ne sais pas</option>
      <option value="Minérale">Minérale</option>
      <option value="Semi-synthétique">Semi-synthétique</option>
      <option value="Synthétique">Synthétique</option>
    </select>
    <button id="enregistrer">Enregistrer ma voiture</button>
    <button id="retour" class="gris">Retour</button>
  </div>
  <div id="message"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="calculs.js"></script>
<script>
var sb = supabase.createClient(
  "https://duwvhjhajgzkizfsrscx.supabase.co",
  "sb_publishable_u3Rc1lmK6RhhpTsvns5LDw_9Y7tvkba"
);
var ecranA = document.getElementById("ecran-a");
var ecranB = document.getElementById("ecran-b");
var zone = document.getElementById("message");
function dire(t) { zone.textContent = t; }
function val(id) { return document.getElementById(id).value.trim(); }
function dateISO(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function suivant() {
  var usage = document.querySelector('input[name="usage"]:checked');
  if (!val("marque") || !val("modele")) { dire("Écris la marque et le modèle."); return; }
  if (val("km") === "") { dire("Écris le kilométrage de ton compteur."); return; }
  if (!usage) { dire("Réponds à la question : Tu roules comment ?"); return; }
  dire("");
  ecranA.style.display = "none";
  ecranB.style.display = "block";
}
function retour() {
  ecranB.style.display = "none";
  ecranA.style.display = "block";
  dire("");
}
async function enregistrer() {
  var bouton = document.getElementById("enregistrer");
  var km = Number(val("km"));
  var vk = val("vk");
  if (vk !== "" && Number(vk) > km) { dire("Vérifie tes kilométrages : la vidange est plus grande que le compteur."); return; }
  var s = await sb.auth.getSession();
  if (!s.data.session) { window.location.href = "connexion.html"; return; }
  var user = s.data.session.user;
  var m = String(user.email || "").match(/^n(\d+)@/);
  var huile = val("huile");
  var voiture = {
    user_id: user.id,
    marque: val("marque"),
    modele: val("modele"),
    kilometrage: km,
    kilometrage_maj: dateISO(new Date()),
    usage_vehicule: document.querySelector('input[name="usage"]:checked').value,
    type_huile: huile,
    intervalle_km: MVM.estimerIntervalle(huile, "essence", "km"),
    contact_rappel: m ? m[1] : null,
    assurance_fin: val("assurance") || null,
    visite_technique_fin: val("visite") || null,
    derniere_vidange_km: vk === "" ? null : Number(vk)
  };
  bouton.disabled = true;
  dire("Enregistrement...");
  var r = await sb.from("voitures").insert(voiture);
  if (r.error) { bouton.disabled = false; dire("Erreur : " + r.error.message); return; }
  window.location.href = "tableau.html";
}
function chiffres(id) {
  var c = document.getElementById(id);
  c.addEventListener("input", function () { c.value = c.value.replace(/\D/g, ""); });
}
chiffres("km");
chiffres("vk");
function marquerChoix() {
  document.querySelectorAll(".choix").forEach(function (l) {
    l.classList.toggle("on", l.querySelector("input").checked);
  });
}
document.querySelectorAll(".choix").forEach(function (l) {
  l.addEventListener("click", function () {
    l.querySelector("input").checked = true;
    marquerChoix();
  });
});
document.getElementById("suivant").addEventListener("click", suivant);
document.getElementById("retour").addEventListener("click", retour);
document.getElementById("enregistrer").addEventListener("click", enregistrer);
marquerChoix();
sb.auth.getSession().then(function (s) {
  if (!s.data.session) window.location.href = "connexion.html";
});
</script>
</body>
</html>
